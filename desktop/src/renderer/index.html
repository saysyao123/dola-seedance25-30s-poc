<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seedance Desktop Studio</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="accounts-panel">
      <div class="brand">
        <div class="brand-title">Seedance Studio</div>
        <div class="brand-subtitle">Dola 多账号 POC · D0</div>
      </div>

      <button id="add-account" class="primary">+ 添加账号</button>
      <div id="accounts" class="accounts"></div>

      <div class="safety-note">
        每个账号使用独立本地 Session。首次请在中间 Dola 页面手动登录；本工具不保存 Google 密码或 TOTP。
      </div>
    </aside>

    <main class="browser-panel">
      <div class="browser-toolbar">
        <span id="active-account">尚未选择账号</span>
        <div class="toolbar-actions">
          <button id="reload-account">刷新 Dola</button>
          <button id="clear-session" class="danger-ghost">清除本账号登录态</button>
        </div>
      </div>
      <div id="webviews" class="webviews">
        <div id="empty-browser" class="empty-state">
          <h2>先添加一个 Dola 账号</h2>
          <p>添加后将在这里打开独立 Dola 会话。每个账号互不共享 Cookie。</p>
        </div>
      </div>
    </main>

    <aside class="studio-panel">
      <div class="studio-header">
        <h2>Seedance 任务</h2>
        <span class="badge experimental">D0</span>
      </div>

      <label>模型</label>
      <select disabled>
        <option>Seedance 2.5</option>
      </select>

      <label>时长</label>
      <div class="duration-row">
        <button disabled>10s</button>
        <button disabled title="D3 验证后启用">30s · Research</button>
      </div>

      <label>Prompt</label>
      <textarea disabled placeholder="D2/D3 接通任务层后在这里提交"></textarea>

      <button class="primary" disabled>创建任务</button>

      <section class="gate-card">
        <h3>当前 Gate</h3>
        <p><b>D0：</b>多账号 Electron 容器</p>
        <ul>
          <li>添加/切换账号</li>
          <li>独立 persistent partition</li>
          <li>可见 Dola 页面</li>
          <li>手动登录并持久化</li>
        </ul>
        <p class="muted">30 秒生成在 D3 验证，不在 D0 伪装成已完成。</p>
      </section>
    </aside>
  </div>

  <script src="./app.js"></script>
</body>
</html>
